version: '3.8'

services:
  fastapi-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: startup_intelligence_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
